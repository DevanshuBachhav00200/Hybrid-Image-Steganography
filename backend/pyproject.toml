[project]
name = "hybrid-image-steganography-backend"
version = "1.0.0"
description = "FastAPI backend for Hybrid Image Steganography System Using Morse Code Encoding and Multi-Domain Data Embedding Techniques"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.4",
    "PyWavelets>=1.6.0",
    "scikit-image>=0.23.0",
    "Pillow>=10.3.0",
    "pycryptodome>=3.20.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
